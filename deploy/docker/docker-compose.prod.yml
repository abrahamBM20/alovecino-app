services:
  api-gateway:
    build:
      context: ../../backend/api-gateway
      dockerfile: Dockerfile.prod
    container_name: alovecino-api-gateway-prod
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60}
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      USUARIOS_SERVICE_URL: http://usuarios-service:8080
      GEO_SERVICE_URL: http://geo-service:8080
      AUTH_SERVICE_URL: http://auth-service:8080
      AUTH_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-alovecino-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-alovecino-api}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${PROD_CORS_ALLOWED_ORIGINS}
    ports:
      - "${PROD_GATEWAY_PORT:-80}:8080"
    depends_on:
      - auth-service
      - usuarios-service
      - geo-service

  auth-service:
    build:
      context: ../../backend/auth-service
      dockerfile: Dockerfile.prod
    container_name: alovecino-auth-service-prod
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60}
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${PROD_NEON_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${PROD_NEON_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PROD_NEON_DATABASE_PASSWORD}
      APP_JWT_PRIVATE_KEY: ${PROD_APP_JWT_PRIVATE_KEY}
      APP_JWT_PUBLIC_KEY: ${PROD_APP_JWT_PUBLIC_KEY}
      APP_JWT_REFRESH_COOKIE_SECURE: ${PROD_APP_JWT_REFRESH_COOKIE_SECURE:-true}
      APP_JWT_REFRESH_COOKIE_SAME_SITE: ${PROD_APP_JWT_REFRESH_COOKIE_SAME_SITE:-None}

  usuarios-service:
    build:
      context: ../../backend/usuarios-service
      dockerfile: Dockerfile.prod
    container_name: alovecino-usuarios-service-prod
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60}
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${PROD_NEON_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${PROD_NEON_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PROD_NEON_DATABASE_PASSWORD}
      AUTH_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-alovecino-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-alovecino-api}

  geo-service:
    build:
      context: ../../backend/geo-service
      dockerfile: Dockerfile.prod
    container_name: alovecino-geo-service-prod
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60}
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${PROD_NEON_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${PROD_NEON_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PROD_NEON_DATABASE_PASSWORD}
      AUTH_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
      GEO_SERVICE_URL: http://geo-service:8080
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-alovecino-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-alovecino-api}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
