services:
  api-gateway:
    build:
      context: ../../backend/api-gateway
      dockerfile: Dockerfile
    container_name: alovecino-api-gateway-qa
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SERVER_PORT: 8080
      USUARIOS_SERVICE_URL: http://usuarios-service:8080
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8081}
      AUTH_JWK_SET_URI: ${AUTH_JWK_SET_URI:-http://host.docker.internal:8081/.well-known/jwks.json}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-alovecino-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-alovecino-api}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-https://api-qa.example.com}
    ports:
      - "${GATEWAY_SERVICE_PORT:-8080}:8080"
    depends_on:
      - usuarios-service
    extra_hosts:
      - "host.docker.internal:host-gateway"

  usuarios-service:
    build:
      context: ../../backend/usuarios-service
      dockerfile: Dockerfile
    container_name: alovecino-usuarios-service-qa
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${NEON_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${NEON_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${NEON_DATABASE_PASSWORD}
    ports:
      - "${USUARIOS_SERVICE_PORT:-8081}:8080"
