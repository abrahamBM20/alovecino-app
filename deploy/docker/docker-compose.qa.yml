services:
  api-gateway:
    build:
      context: ../../backend/api-gateway
      dockerfile: Dockerfile
    container_name: alovecino-api-gateway-qa
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SERVER_PORT: 8080
      USUARIOS_SERVICE_URL: http://usuarios-service:8080
      GEO_SERVICE_URL: http://geo-service:8080
      AUTH_SERVICE_URL: http://auth-service:8080
      AUTH_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-alovecino-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-alovecino-api}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-https://api-qa.example.com}
    ports:
      - "${GATEWAY_SERVICE_PORT:-8080}:8080"
    depends_on:
      - auth-service
      - usuarios-service
      - geo-service

  auth-service:
    build:
      context: ../../backend/auth-service
      dockerfile: Dockerfile
    container_name: alovecino-auth-service-qa
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${NEON_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${NEON_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${NEON_DATABASE_PASSWORD}
      APP_JWT_PRIVATE_KEY: ${APP_JWT_PRIVATE_KEY:-}
      APP_JWT_PUBLIC_KEY: ${APP_JWT_PUBLIC_KEY:-}
    ports:
      - "${AUTH_SERVICE_PORT:-8082}:8080"

  usuarios-service:
    build:
      context: ../../backend/usuarios-service
      dockerfile: Dockerfile
    container_name: alovecino-usuarios-service-qa
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${NEON_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${NEON_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${NEON_DATABASE_PASSWORD}
      AUTH_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-alovecino-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-alovecino-api}
    ports:
      - "${USUARIOS_SERVICE_PORT:-8081}:8080"

  geo-service:
    build:
      context: ../../backend/geo-service
      dockerfile: Dockerfile
    container_name: alovecino-geo-service-qa
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${NEON_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${NEON_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${NEON_DATABASE_PASSWORD}
      AUTH_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
      GEO_SERVICE_URL: http://geo-service:8080
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-alovecino-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-alovecino-api}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "${GEO_SERVICE_PORT:-8083}:8080"
