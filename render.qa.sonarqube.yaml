services:
  - type: web
    name: alovecino-sonarqube-qa
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./deploy/sonarqube/Dockerfile
    dockerContext: ./deploy/sonarqube
    healthCheckPath: /api/system/status
    disk:
      name: sonarqube-data
      mountPath: /opt/sonarqube/data
      sizeGB: 10
    envVars:
      - key: SONAR_POSTGRES_URL
        fromDatabase:
          name: alovecino-sonarqube-postgres-qa
          property: connectionString
      - key: SONAR_JDBC_USERNAME
        fromDatabase:
          name: alovecino-sonarqube-postgres-qa
          property: user
      - key: SONAR_JDBC_PASSWORD
        fromDatabase:
          name: alovecino-sonarqube-postgres-qa
          property: password
      - key: SONAR_WEB_JAVAOPTS
        value: -Xms128m -Xmx512m
      - key: SONAR_CE_JAVAOPTS
        value: -Xms128m -Xmx512m
      - key: SONAR_SEARCH_JAVAOPTS
        value: -Xms512m -Xmx512m

databases:
  - name: alovecino-sonarqube-postgres-qa
    databaseName: sonarqube
    user: sonarqube
    plan: basic-256mb
    diskSizeGB: 5
    region: oregon
    postgresMajorVersion: "17"
