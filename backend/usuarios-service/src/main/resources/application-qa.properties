# QA configuration. Values must come from environment/secrets.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

usuarios.security.jwt.jwk-set-uri=${AUTH_JWK_SET_URI}
usuarios.security.jwt.issuer=${AUTH_JWT_ISSUER:alovecino-auth}
usuarios.security.jwt.audience=${AUTH_JWT_AUDIENCE:alovecino-api}
usuarios.geo-service.base-url=${GEO_SERVICE_URL}
usuarios.geo-service.timeout-ms=${GEO_SERVICE_TIMEOUT_MS:10000}
usuarios.geo-service.internal-api-key=${GEO_INTERNAL_API_KEY:}

logging.level.org.springframework.web=INFO
