spring.application.name=usuarios-service
spring.datasource.url=# ${NEON_DATABASE_URL:jdbc:postgresql://<neon-host>:5432/<database>?sslmode=require}
spring.datasource.username=# ${NEON_DATABASE_USERNAME:<username>}
spring.datasource.password=# ${NEON_DATABASE_PASSWORD:<password>}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
