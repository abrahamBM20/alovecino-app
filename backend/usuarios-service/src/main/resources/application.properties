spring.application.name=usuarios-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${NEON_DATABASE_URL:jdbc:postgresql://localhost:5432/alovecino_dev}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${NEON_DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${NEON_DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

usuarios.security.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
usuarios.security.jwt.issuer=${AUTH_JWT_ISSUER:alovecino-auth}
usuarios.security.jwt.audience=${AUTH_JWT_AUDIENCE:alovecino-api}
usuarios.geo-service.base-url=${GEO_SERVICE_URL:http://localhost:8083}
usuarios.geo-service.timeout-ms=${GEO_SERVICE_TIMEOUT_MS:2500}

management.endpoints.web.exposure.include=health,info
