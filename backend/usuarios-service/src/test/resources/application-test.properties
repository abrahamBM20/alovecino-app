spring.datasource.url=jdbc:h2:mem:usuariosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

usuarios.security.jwt.jwk-set-uri=http://localhost:8081/.well-known/jwks.json
usuarios.security.jwt.issuer=alovecino-auth
usuarios.security.jwt.audience=alovecino-api
usuarios.geo-service.base-url=http://localhost:8083
usuarios.geo-service.timeout-ms=250
management.endpoints.web.exposure.include=health,info
