# QA configuration. Values must come from environment/secrets.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.jwt.private-key=${APP_JWT_PRIVATE_KEY}
app.jwt.public-key=${APP_JWT_PUBLIC_KEY}
app.jwt.issuer=${AUTH_JWT_ISSUER:alovecino-auth}
app.jwt.audience=${AUTH_JWT_AUDIENCE:alovecino-api}
app.jwt.refresh-cookie-secure=${APP_JWT_REFRESH_COOKIE_SECURE:true}
app.jwt.refresh-cookie-same-site=${APP_JWT_REFRESH_COOKIE_SAME_SITE:Strict}

logging.level.org.springframework.web=INFO
