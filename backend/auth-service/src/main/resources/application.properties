spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:${NEON_DATABASE_URL:jdbc:postgresql://localhost:5432/alovecino_dev}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${NEON_DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${NEON_DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.jwt.issuer=alovecino-auth
app.jwt.audience=alovecino-api
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d
app.jwt.refresh-cookie-secure=${APP_JWT_REFRESH_COOKIE_SECURE:false}
app.jwt.refresh-cookie-same-site=${APP_JWT_REFRESH_COOKIE_SAME_SITE:Lax}
app.jwt.key-id=auth-key-1
app.jwt.private-key=${APP_JWT_PRIVATE_KEY:}
app.jwt.public-key=${APP_JWT_PUBLIC_KEY:}

management.endpoints.web.exposure.include=health,info
