spring.application.name=geolocation-service
server.port=${SERVER_PORT:8080}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer=${AUTH_JWT_ISSUER:alovecino-auth}
spring.security.oauth2.resourceserver.jwt.audience=${AUTH_JWT_AUDIENCE:alovecino-api}

management.endpoints.web.exposure.include=health,info
