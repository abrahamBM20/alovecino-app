server:
  port: ${SERVER_PORT:${GATEWAY_PORT:8082}}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 30s
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:19006,http://localhost:3000,http://localhost:8081}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: '*'
                exposed-headers:
                  - Authorization
                  - X-Request-Id
                allow-credentials: false
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security.oauth2.server.resource: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

gateway:
  services:
    auth:
      base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    usuarios:
      base-url: ${USUARIOS_SERVICE_URL:http://localhost:8080}
  security:
    jwt:
      jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${AUTH_JWT_ISSUER:alovecino-auth}
      audience: ${AUTH_JWT_AUDIENCE:alovecino-api}
