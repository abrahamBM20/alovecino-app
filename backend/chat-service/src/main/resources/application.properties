spring.application.name=consulta-service
server.port=${SERVER_PORT:8083}
# Default local database for development and quick startup
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:consulta;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA configuration for local H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for local in-memory startup
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# JWT Security configuration
# El token se valida con JWKS para ser compatible con auth-service, que firma con RS256.
consulta.security.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Swagger/OpenAPI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html