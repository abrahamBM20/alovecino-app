# PostgreSQL Database configuration for development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alovecino_consulta_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JWT Security configuration for development
consulta.security.jwt.secret-key=${CONSULTA_JWT_SECRET:mySecretKeyDev}
consulta.security.jwt.expiration-time=86400000

# Logging configuration for development
logging.level.com.alovecino.consultaservice=DEBUG
logging.level.org.springframework.security=DEBUG