# PostgreSQL Database configuration for development
spring.datasource.url=jdbc:postgresql://localhost:5432/alovecino_consulta_dev
spring.datasource.username=postgres
spring.datasource.password=postgres

# JWT Security configuration for development
consulta.security.jwt.secret-key=mySecretKeyDev
consulta.security.jwt.expiration-time=86400000

# Logging configuration for development
logging.level.com.alovecino.consultaservice=DEBUG
logging.level.org.springframework.security=DEBUG