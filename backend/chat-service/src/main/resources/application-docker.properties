# Docker/PostgreSQL profile for consulta-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/alovecino_consulta_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

consulta.security.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://auth-service:8081/.well-known/jwks.json}

logging.level.com.alovecino.consultaservice=${CONSULTA_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}
