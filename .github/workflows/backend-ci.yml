name: Backend CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

env:
  RENDER_DEV_AUTH_SERVICE_ID: ${{ vars.RENDER_DEV_AUTH_SERVICE_ID }}
  RENDER_DEV_AUTH_SERVICE_NAME: ${{ vars.RENDER_DEV_AUTH_SERVICE_NAME || 'alovecino-auth-service-dev' }}
  RENDER_DEV_USUARIOS_SERVICE_ID: ${{ vars.RENDER_DEV_USUARIOS_SERVICE_ID }}
  RENDER_DEV_USUARIOS_SERVICE_NAME: ${{ vars.RENDER_DEV_USUARIOS_SERVICE_NAME || 'alovecino-usuarios-service-dev' }}
  RENDER_DEV_GEO_SERVICE_ID: ${{ vars.RENDER_DEV_GEO_SERVICE_ID }}
  RENDER_DEV_GEO_SERVICE_NAME: ${{ vars.RENDER_DEV_GEO_SERVICE_NAME || 'alovecino-geo-service-dev' }}
  RENDER_DEV_API_GATEWAY_SERVICE_ID: ${{ vars.RENDER_DEV_API_GATEWAY_SERVICE_ID }}
  RENDER_DEV_API_GATEWAY_SERVICE_NAME: ${{ vars.RENDER_DEV_API_GATEWAY_SERVICE_NAME || 'alovecino-api-gateway-dev' }}
  RENDER_DEV_CHAT_SERVICE_ID: ${{ vars.RENDER_DEV_CHAT_SERVICE_ID }}
  RENDER_DEV_CHAT_SERVICE_NAME: ${{ vars.RENDER_DEV_CHAT_SERVICE_NAME || 'alovecino-chat-service-dev' }}

jobs:
  api-gateway:
    name: api-gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn test

  auth-service:
    name: auth-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/auth-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn test

  usuarios-service:
    name: usuarios-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/usuarios-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn test

  geo-service:
    name: geo-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/geo-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn test

  chat-service:
    name: chat-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/chat-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn test

  render-dev-deploy:
    name: Render dev deploy
    runs-on: ubuntu-latest
    needs:
      - api-gateway
      - auth-service
      - usuarios-service
      - geo-service
      - chat-service
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GEO_INTERNAL_API_KEY: ${{ secrets.GEO_INTERNAL_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Validate Render API key
        run: test -n "$RENDER_API_KEY"

      - name: Trigger Render dev deploys
        shell: bash
        run: |
          set -euo pipefail

          services_json="$(mktemp)"
          curl --fail --silent --show-error \
            --url "https://api.render.com/v1/services?limit=100" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" > "$services_json"

          resolve_service_id() {
            local configured_id="$1"
            local service_name="$2"

            if [ -n "$configured_id" ]; then
              printf '%s' "$configured_id"
              return 0
            fi

            if [ -z "$service_name" ]; then
              return 0
            fi

            jq -r --arg name "$service_name" \
              '[.[] | (.service // .) | select(.name == $name) | .id][0] // empty' \
              "$services_json"
          }

          resolve_service_url() {
            local service_id="$1"

            jq -r --arg id "$service_id" \
              '[.[] | (.service // .) | select(.id == $id) | .serviceDetails.url][0] // empty' \
              "$services_json"
          }

          set_render_env() {
            local service_id="$1"
            local key="$2"
            local value="$3"

            jq -n --arg value "$value" '{value: $value}' |
              curl --fail --silent --show-error --request PUT \
                --url "https://api.render.com/v1/services/${service_id}/env-vars/${key}" \
                --header "Authorization: Bearer ${RENDER_API_KEY}" \
                --header "Accept: application/json" \
                --header "Content-Type: application/json" \
                --data @- >/dev/null
          }

          configure_geocode_runtime() {
            local usuarios_id
            local geo_id
            local geo_url
            local internal_key="${GEO_INTERNAL_API_KEY:-}"

            usuarios_id="$(resolve_service_id "$RENDER_DEV_USUARIOS_SERVICE_ID" "$RENDER_DEV_USUARIOS_SERVICE_NAME")"
            geo_id="$(resolve_service_id "$RENDER_DEV_GEO_SERVICE_ID" "$RENDER_DEV_GEO_SERVICE_NAME")"
            geo_url="$(resolve_service_url "$geo_id")"

            if [ -z "$usuarios_id" ] || [ -z "$geo_id" ]; then
              echo "Skipping geocode runtime setup: usuarios-service or geo-service was not resolved."
              return 0
            fi

            if [ -z "$geo_url" ]; then
              echo "Skipping geocode runtime setup: geo-service URL was not resolved."
              return 0
            fi

            if [ -z "$internal_key" ]; then
              internal_key="$(openssl rand -hex 32)"
              echo "Generated deploy-scoped GEO_INTERNAL_API_KEY for dev services."
            fi

            set_render_env "$usuarios_id" GEO_SERVICE_URL "$geo_url"
            set_render_env "$usuarios_id" GEO_INTERNAL_API_KEY "$internal_key"
            set_render_env "$geo_id" GEO_INTERNAL_API_KEY "$internal_key"

            if [ -n "${GOOGLE_MAPS_API_KEY:-}" ]; then
              set_render_env "$geo_id" GOOGLE_MAPS_API_KEY "$GOOGLE_MAPS_API_KEY"
            else
              echo "GOOGLE_MAPS_API_KEY secret is not configured; geo-service will keep using its existing Render value or fail real geocoding."
            fi
          }

          trigger_deploy() {
            local label="$1"
            local configured_id="$2"
            local service_name="$3"
            local optional="${4:-false}"
            local service_id

            service_id="$(resolve_service_id "$configured_id" "$service_name")"
            if [ -z "$service_id" ]; then
              if [ "$optional" = "true" ]; then
                echo "Skipping optional ${label}: service not configured."
                return 0
              fi

              echo "Render service not found for ${label}. Configure ${label} ID as a GitHub variable or ensure service name exists: ${service_name}."
              exit 1
            fi

            echo "Triggering Render deploy for ${label} (${service_id})."
            jq -n --arg commit "$GITHUB_SHA" '{clearCache: "do_not_clear", commitId: $commit}' |
              curl --fail --silent --show-error --request POST \
                --url "https://api.render.com/v1/services/${service_id}/deploys" \
                --header "Authorization: Bearer ${RENDER_API_KEY}" \
                --header "Accept: application/json" \
                --header "Content-Type: application/json" \
                --data @- >/dev/null
          }

          configure_geocode_runtime
          trigger_deploy "auth-service" "$RENDER_DEV_AUTH_SERVICE_ID" "$RENDER_DEV_AUTH_SERVICE_NAME"
          trigger_deploy "usuarios-service" "$RENDER_DEV_USUARIOS_SERVICE_ID" "$RENDER_DEV_USUARIOS_SERVICE_NAME"
          trigger_deploy "geo-service" "$RENDER_DEV_GEO_SERVICE_ID" "$RENDER_DEV_GEO_SERVICE_NAME"
          trigger_deploy "api-gateway" "$RENDER_DEV_API_GATEWAY_SERVICE_ID" "$RENDER_DEV_API_GATEWAY_SERVICE_NAME"
          trigger_deploy "chat-service" "$RENDER_DEV_CHAT_SERVICE_ID" "$RENDER_DEV_CHAT_SERVICE_NAME"
