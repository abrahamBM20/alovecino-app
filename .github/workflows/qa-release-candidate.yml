name: QA Release Candidate

on:
  pull_request:
    branches:
      - qa
  push:
    branches:
      - qa
  workflow_dispatch:
    inputs:
      base_url:
        description: "QA base URL. Leave empty to use QA_BASE_URL variable."
        required: false
        type: string

concurrency:
  group: qa-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Unit coverage and static analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'alovecino-app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run backend coverage
        run: |
          mvn -f backend/api-gateway/pom.xml test
          mvn -f backend/auth-service/pom.xml test
          mvn -f backend/geo-service/pom.xml test
          mvn -f backend/usuarios-service/pom.xml test

      - name: Run frontend coverage
        run: npm run test:coverage -- --silent
        working-directory: frontend

      - name: Prepare static evidence directory
        run: mkdir -p qa-evidence

      - name: Validate HU acceptance coverage
        run: node tests/static/qa-acceptance-coverage.mjs

      - name: Run Semgrep free static analysis
        run: |
          docker run --rm -v "${PWD}:/src" -w /src semgrep/semgrep semgrep scan --config p/ci --sarif --output qa-evidence/semgrep.sarif

      - name: Run SonarQube analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && env.SONAR_PROJECT_KEY != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}

      - name: Upload code quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-code-quality-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            qa-evidence/**
            backend/**/target/surefire-reports/**
            backend/**/target/site/jacoco/**
            frontend/coverage/**

  api-and-performance:
    name: API and K6 evidence
    runs-on: ubuntu-latest
    env:
      INPUT_BASE_URL: ${{ inputs.base_url }}
      QA_BASE_URL: ${{ vars.QA_BASE_URL }}
      BASE_URL: ${{ inputs.base_url || vars.QA_BASE_URL }}
      QA_AUTH_SERVICE_URL: ${{ vars.QA_AUTH_SERVICE_URL || 'https://alovecino-auth-service-qa.onrender.com' }}
      QA_USUARIOS_SERVICE_URL: ${{ vars.QA_USUARIOS_SERVICE_URL || 'https://alovecino-usuarios-service-qa.onrender.com' }}
      QA_GEO_SERVICE_URL: ${{ vars.QA_GEO_SERVICE_URL || 'https://alovecino-geo-service-qa.onrender.com' }}
      QA_CHAT_SERVICE_URL: ${{ vars.QA_CHAT_SERVICE_URL || 'https://alovecino-chat-service-qa.onrender.com' }}
      QA_LOGIN_EMAIL: ${{ secrets.QA_LOGIN_EMAIL }}
      QA_LOGIN_PASSWORD: ${{ secrets.QA_LOGIN_PASSWORD }}
      QA_ALMACEN_LOGIN_EMAIL: ${{ secrets.QA_ALMACEN_LOGIN_EMAIL }}
      QA_ALMACEN_LOGIN_PASSWORD: ${{ secrets.QA_ALMACEN_LOGIN_PASSWORD }}
      QA_ADMIN_LOGIN_EMAIL: ${{ secrets.QA_ADMIN_LOGIN_EMAIL }}
      QA_ADMIN_LOGIN_PASSWORD: ${{ secrets.QA_ADMIN_LOGIN_PASSWORD }}
      QA_ALMACEN_ID: ${{ vars.QA_ALMACEN_ID }}
      QA_CLIENTE_ID: ${{ vars.QA_CLIENTE_ID }}
      QA_CONSULTA_ID: ${{ vars.QA_CONSULTA_ID }}
      QA_MAP_LATITUDE: ${{ vars.QA_MAP_LATITUDE || '-33.44889' }}
      QA_MAP_LONGITUDE: ${{ vars.QA_MAP_LONGITUDE || '-70.669265' }}
      QA_MAP_RADIUS_METERS: ${{ vars.QA_MAP_RADIUS_METERS || '500' }}
      RUN_QA_REGISTER_SMOKE: ${{ vars.RUN_QA_REGISTER_SMOKE || 'false' }}
      LIVE_QA_TARGET: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        if: env.LIVE_QA_TARGET == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare evidence directory
        run: mkdir -p qa-evidence

      - name: Defer live API and K6 evidence
        if: env.LIVE_QA_TARGET != 'true'
        run: |
          {
            echo "status=deferred"
            echo "reason=Live API/K6 evidence runs after qa deploy via workflow_dispatch."
            echo "event=${{ github.event_name }}"
            echo "base_url=${BASE_URL}"
            date -u +"UTC=%Y-%m-%dT%H:%M:%SZ"
          } > qa-evidence/api-k6-deferred.txt

      - name: Validate QA target
        if: env.LIVE_QA_TARGET == 'true' && env.BASE_URL == ''
        run: |
          echo "QA_BASE_URL is not configured and no base_url input was provided." | tee qa-evidence/qa-target.txt
          exit 1

      - name: Install Newman
        if: env.LIVE_QA_TARGET == 'true'
        run: npm install --global newman

      - name: Wait for QA gateway
        if: env.LIVE_QA_TARGET == 'true'
        shell: bash
        run: |
          for attempt in {1..40}; do
            status="$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 90 "${BASE_URL}/actuator/health" || true)"
            if [ "$status" = "200" ]; then
              echo "QA gateway is healthy."
              exit 0
            fi

            echo "Waiting for QA gateway (${attempt}/40), status=${status}"
            sleep 15
          done

          echo "QA gateway did not become healthy in time." | tee qa-evidence/qa-health-timeout.txt
          exit 1

      - name: Warm up QA downstream services
        if: env.LIVE_QA_TARGET == 'true'
        shell: bash
        run: |
          wait_for_service() {
            local name="$1"
            local url="$2"

            for attempt in {1..6}; do
              status="$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 120 "${url}/actuator/health" || true)"
              echo "${name} warm-up attempt ${attempt}/6 status=${status}" | tee -a qa-evidence/downstream-warmup.txt
              if [ "$status" = "200" ]; then
                return 0
              fi
              sleep 10
            done

            echo "${name} did not become healthy at ${url}" | tee -a qa-evidence/downstream-warmup.txt
            return 1
          }

          wait_for_service "auth-service" "${QA_AUTH_SERVICE_URL}"
          wait_for_service "usuarios-service" "${QA_USUARIOS_SERVICE_URL}"
          wait_for_service "geo-service" "${QA_GEO_SERVICE_URL}"
          wait_for_service "chat-service" "${QA_CHAT_SERVICE_URL}"

      - name: Run Postman collection
        if: env.LIVE_QA_TARGET == 'true'
        shell: bash
        run: |
          set +e
          newman run tests/postman/alovecino-api.postman_collection.json \
            --env-var baseUrl="${BASE_URL}" \
            --env-var qaLoginEmail="${QA_LOGIN_EMAIL}" \
            --env-var qaLoginPassword="${QA_LOGIN_PASSWORD}" \
            --env-var qaAlmacenLoginEmail="${QA_ALMACEN_LOGIN_EMAIL}" \
            --env-var qaAlmacenLoginPassword="${QA_ALMACEN_LOGIN_PASSWORD}" \
            --env-var qaAdminLoginEmail="${QA_ADMIN_LOGIN_EMAIL}" \
            --env-var qaAdminLoginPassword="${QA_ADMIN_LOGIN_PASSWORD}" \
            --env-var qaAlmacenId="${QA_ALMACEN_ID}" \
            --env-var qaClienteId="${QA_CLIENTE_ID}" \
            --env-var qaConsultaId="${QA_CONSULTA_ID}" \
            --env-var qaMapLatitude="${QA_MAP_LATITUDE}" \
            --env-var qaMapLongitude="${QA_MAP_LONGITUDE}" \
            --env-var qaMapRadiusMeters="${QA_MAP_RADIUS_METERS}" \
            --env-var runRegisterSmoke="${RUN_QA_REGISTER_SMOKE}" \
            --timeout-request 90000 \
            --reporters cli,json,junit \
            --reporter-json-export qa-evidence/newman-report.json \
            --reporter-junit-export qa-evidence/newman-junit.xml
          echo "$?" > qa-evidence/newman-exit-code.txt

      - name: Set up K6
        if: env.LIVE_QA_TARGET == 'true'
        uses: grafana/setup-k6-action@v1

      - name: Run K6 smoke load
        if: env.LIVE_QA_TARGET == 'true'
        shell: bash
        run: |
          set +e
          QA_MAP_LATITUDE="${QA_MAP_LATITUDE}" \
          QA_MAP_LONGITUDE="${QA_MAP_LONGITUDE}" \
          k6 run --summary-export qa-evidence/k6-summary.json tests/k6/alovecino-smoke.js
          echo "$?" > qa-evidence/k6-exit-code.txt

      - name: Evaluate API and performance evidence
        if: env.LIVE_QA_TARGET == 'true'
        run: node tests/static/summarize-api-k6-evidence.mjs

      - name: Store QA target
        if: always()
        run: |
          echo "BASE_URL=${BASE_URL}" > qa-evidence/qa-target.txt
          date -u +"UTC=%Y-%m-%dT%H:%M:%SZ" >> qa-evidence/qa-target.txt

      - name: Upload API and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-api-performance-evidence
          retention-days: 14
          if-no-files-found: warn
          path: qa-evidence/**

  mobile-e2e:
    name: Mobile E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APPIUM_APK_URL: ${{ secrets.APPIUM_APK_URL }}
      APPIUM_LOGIN_EMAIL: ${{ secrets.QA_LOGIN_EMAIL }}
      APPIUM_LOGIN_PASSWORD: ${{ secrets.QA_LOGIN_PASSWORD }}
      LIVE_QA_TARGET: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Prepare mobile evidence directory
        run: mkdir -p qa-evidence

      - name: Defer mobile E2E smoke
        if: env.LIVE_QA_TARGET != 'true'
        run: |
          {
            echo "status=deferred"
            echo "reason=Mobile E2E smoke runs after QA deploy and EAS build via workflow_dispatch."
            echo "event=${{ github.event_name }}"
            date -u +"UTC=%Y-%m-%dT%H:%M:%SZ"
          } > qa-evidence/mobile-e2e-deferred.txt

      - name: Skip when APK URL is missing
        if: env.LIVE_QA_TARGET == 'true' && env.APPIUM_APK_URL == ''
        run: echo "APPIUM_APK_URL is not configured; skipping mobile E2E smoke." | tee qa-evidence/mobile-e2e-skipped.txt

      - name: Checkout
        if: env.LIVE_QA_TARGET == 'true' && env.APPIUM_APK_URL != ''
        uses: actions/checkout@v4

      - name: Set up Node
        if: env.LIVE_QA_TARGET == 'true' && env.APPIUM_APK_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download APK
        if: env.LIVE_QA_TARGET == 'true' && env.APPIUM_APK_URL != ''
        run: |
          curl --location --fail "$APPIUM_APK_URL" --output "$RUNNER_TEMP/alovecino.apk"
          echo "APPIUM_APP_PATH=$RUNNER_TEMP/alovecino.apk" >> "$GITHUB_ENV"

      - name: Install Appium
        if: env.LIVE_QA_TARGET == 'true' && env.APPIUM_APK_URL != ''
        run: |
          npm install --global appium
          appium driver install uiautomator2
          npm install webdriverio
        working-directory: tests/e2e/appium

      - name: Enable KVM
        if: env.LIVE_QA_TARGET == 'true' && env.APPIUM_APK_URL != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Appium smoke on emulator
        if: env.LIVE_QA_TARGET == 'true' && env.APPIUM_APK_URL != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back none
          disable-animations: false
          emulator-boot-timeout: 1200
          script: bash tests/e2e/appium/run-smoke-ci.sh

      - name: Upload mobile E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-mobile-e2e-evidence
          retention-days: 7
          if-no-files-found: warn
          path: qa-evidence/**
