name: Backend Docker build

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker-build.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker-build.yml'

jobs:
  docker-build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - usuarios-service
          - chat-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t alovecino/${{ matrix.service }}:ci backend/${{ matrix.service }}
