name: Production CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mobile_action:
        description: Mobile delivery action
        required: true
        default: auto
        type: choice
        options:
          - auto
          - update
          - apk
          - store
          - none
      build_prod_preview:
        description: Build Android prod-preview APK (legacy shortcut)
        required: false
        default: false
        type: boolean

concurrency:
  group: production-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend/api-gateway
          - backend/auth-service
          - backend/usuarios-service
          - backend/geo-service
          - backend/chat-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests
        run: mvn test

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

  deploy-backend-ec2:
    name: Deploy backend to EC2
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
    env:
      PROD_EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
      PROD_EC2_USER: ${{ secrets.PROD_EC2_USER }}
      PROD_EC2_SSH_KEY: ${{ secrets.PROD_EC2_SSH_KEY }}
      PROD_NEON_DATABASE_URL: ${{ secrets.PROD_NEON_DATABASE_URL }}
      PROD_NEON_DATABASE_USERNAME: ${{ secrets.PROD_NEON_DATABASE_USERNAME }}
      PROD_NEON_DATABASE_PASSWORD: ${{ secrets.PROD_NEON_DATABASE_PASSWORD }}
      PROD_APP_JWT_PRIVATE_KEY: ${{ secrets.PROD_APP_JWT_PRIVATE_KEY }}
      PROD_APP_JWT_PUBLIC_KEY: ${{ secrets.PROD_APP_JWT_PUBLIC_KEY }}
      PROD_CORS_ALLOWED_ORIGINS: ${{ vars.PROD_CORS_ALLOWED_ORIGINS }}
      PROD_GOOGLE_MAPS_API_KEY: ${{ secrets.PROD_GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
      PROD_CONSULTA_JWT_SECRET: ${{ secrets.PROD_CONSULTA_JWT_SECRET }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate production secrets
        run: |
          test -n "$PROD_EC2_HOST"
          test -n "$PROD_EC2_USER"
          test -n "$PROD_EC2_SSH_KEY"
          test -n "$PROD_NEON_DATABASE_URL"
          test -n "$PROD_NEON_DATABASE_USERNAME"
          test -n "$PROD_NEON_DATABASE_PASSWORD"
          test -n "$PROD_APP_JWT_PRIVATE_KEY"
          test -n "$PROD_APP_JWT_PUBLIC_KEY"
          test -n "$PROD_CORS_ALLOWED_ORIGINS"
          test -n "$PROD_GOOGLE_MAPS_API_KEY"
          test -n "$PROD_CONSULTA_JWT_SECRET"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Package backend services
        run: |
          mvn -f backend/api-gateway/pom.xml -DskipTests package
          mvn -f backend/auth-service/pom.xml -DskipTests package
          mvn -f backend/usuarios-service/pom.xml -DskipTests package
          mvn -f backend/geo-service/pom.xml -DskipTests package
          mvn -f backend/chat-service/pom.xml -DskipTests package

      - name: Create deployment bundle
        run: |
          tar -czf prod-deploy.tar.gz \
            deploy/docker/docker-compose.prod.yml \
            backend/api-gateway/Dockerfile.prod backend/api-gateway/target/*.jar \
            backend/auth-service/Dockerfile.prod backend/auth-service/target/*.jar \
            backend/usuarios-service/Dockerfile.prod backend/usuarios-service/target/*.jar \
            backend/geo-service/Dockerfile.prod backend/geo-service/target/*.jar \
            backend/chat-service/Dockerfile.prod backend/chat-service/target/*.jar

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_EC2_SSH_KEY" > ~/.ssh/prod_ec2_key
          chmod 600 ~/.ssh/prod_ec2_key
          ssh-keyscan -H "$PROD_EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment bundle
        run: |
          ssh -i ~/.ssh/prod_ec2_key "$PROD_EC2_USER@$PROD_EC2_HOST" "mkdir -p /opt/alovecino/prod/current"
          scp -i ~/.ssh/prod_ec2_key prod-deploy.tar.gz "$PROD_EC2_USER@$PROD_EC2_HOST:/opt/alovecino/prod/prod-deploy.tar.gz"

      - name: Deploy with Docker Compose
        run: |
          private_key_escaped="${PROD_APP_JWT_PRIVATE_KEY//$'\n'/\\n}"
          public_key_escaped="${PROD_APP_JWT_PUBLIC_KEY//$'\n'/\\n}"
          ssh -i ~/.ssh/prod_ec2_key "$PROD_EC2_USER@$PROD_EC2_HOST" "cd /opt/alovecino/prod && rm -rf current && mkdir -p current && tar -xzf prod-deploy.tar.gz -C current"
          ssh -i ~/.ssh/prod_ec2_key "$PROD_EC2_USER@$PROD_EC2_HOST" "cat > /opt/alovecino/prod/current/.env" <<EOF
          PROD_GATEWAY_PORT=80
          PROD_CORS_ALLOWED_ORIGINS=${PROD_CORS_ALLOWED_ORIGINS}
          PROD_NEON_DATABASE_URL=${PROD_NEON_DATABASE_URL}
          PROD_NEON_DATABASE_USERNAME=${PROD_NEON_DATABASE_USERNAME}
          PROD_NEON_DATABASE_PASSWORD=${PROD_NEON_DATABASE_PASSWORD}
          PROD_APP_JWT_PRIVATE_KEY=${private_key_escaped}
          PROD_APP_JWT_PUBLIC_KEY=${public_key_escaped}
          PROD_APP_JWT_REFRESH_COOKIE_SECURE=true
          PROD_APP_JWT_REFRESH_COOKIE_SAME_SITE=None
          AUTH_JWT_ISSUER=alovecino-auth
          AUTH_JWT_AUDIENCE=alovecino-api
          GOOGLE_MAPS_API_KEY=${PROD_GOOGLE_MAPS_API_KEY}
          CONSULTA_JWT_SECRET=${PROD_CONSULTA_JWT_SECRET}
          JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60
          EOF
          ssh -i ~/.ssh/prod_ec2_key "$PROD_EC2_USER@$PROD_EC2_HOST" "cd /opt/alovecino/prod/current && docker compose -f deploy/docker/docker-compose.prod.yml --env-file .env up -d --build --remove-orphans"

      - name: Verify production gateway health
        run: |
          for attempt in {1..30}; do
            status="$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 10 "http://${PROD_EC2_HOST}/actuator/health" || true)"
            if [ "$status" = "200" ]; then
              echo "Production gateway is healthy."
              exit 0
            fi

            echo "Waiting for production gateway (${attempt}/30), status=${status}"
            sleep 10
          done

          echo "Production gateway did not become healthy in time."
          exit 1

      - name: Collect production diagnostics
        if: failure()
        run: |
          ssh -i ~/.ssh/prod_ec2_key "$PROD_EC2_USER@$PROD_EC2_HOST" "cd /opt/alovecino/prod/current && docker compose -f deploy/docker/docker-compose.prod.yml --env-file .env ps"
          ssh -i ~/.ssh/prod_ec2_key "$PROD_EC2_USER@$PROD_EC2_HOST" "free -m && df -h && docker stats --no-stream || true"
          ssh -i ~/.ssh/prod_ec2_key "$PROD_EC2_USER@$PROD_EC2_HOST" "cd /opt/alovecino/prod/current && docker compose -f deploy/docker/docker-compose.prod.yml --env-file .env logs --tail=120 api-gateway auth-service usuarios-service geo-service chat-service"

  eas-production-mobile-delivery:
    name: EAS Android production delivery
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
      - deploy-backend-ec2
    if: ${{ always() && needs.backend-tests.result == 'success' && needs.frontend-tests.result == 'success' && needs.deploy-backend-ec2.result == 'success' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_PROD_EAS_UPDATE == 'true' || vars.ENABLE_PROD_PREVIEW_EAS_BUILD == 'true' || vars.ENABLE_PROD_EAS_BUILD == 'true') }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
      REQUESTED_MOBILE_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.build_prod_preview && 'apk' || github.event_name == 'workflow_dispatch' && inputs.mobile_action || 'auto' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve EAS mobile action
        id: mobile
        run: |
          bash scripts/resolve-eas-mobile-action.sh \
            --environment prod \
            --requested-action "$REQUESTED_MOBILE_ACTION"

      - name: Validate production app variables
        if: ${{ steps.mobile.outputs.action != 'none' }}
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$PROD_API_BASE_URL"

      - name: Set up Node
        if: ${{ steps.mobile.outputs.action != 'none' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ steps.mobile.outputs.action != 'none' }}
        working-directory: frontend
        run: npm ci

      - name: Install EAS CLI
        if: ${{ steps.mobile.outputs.action != 'none' }}
        working-directory: frontend
        run: npm install --global eas-cli

      - name: Inject production API URL into EAS profile
        if: ${{ steps.mobile.outputs.action == 'build' }}
        env:
          EAS_BUILD_PROFILE: ${{ steps.mobile.outputs.build_profile }}
        working-directory: frontend
        run: |
          jq --arg profile "$EAS_BUILD_PROFILE" '.build[$profile].env.EXPO_PUBLIC_API_URL = env.PROD_API_BASE_URL' eas.json > eas.tmp.json
          mv eas.tmp.json eas.json

      - name: Run EAS production update
        if: ${{ steps.mobile.outputs.action == 'update' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_PROD_EAS_UPDATE == 'true') }}
        env:
          EXPO_PUBLIC_APP_ENV: prod
          EXPO_PUBLIC_API_URL: ${{ vars.PROD_API_BASE_URL }}
          EAS_UPDATE_BRANCH: ${{ steps.mobile.outputs.update_branch }}
        working-directory: frontend
        run: eas update --branch "$EAS_UPDATE_BRANCH" --message "$GITHUB_SHA" --non-interactive

      - name: Run EAS production Android build
        if: ${{ steps.mobile.outputs.action == 'build' && (github.event_name == 'workflow_dispatch' || (steps.mobile.outputs.build_profile == 'prod-preview' && vars.ENABLE_PROD_PREVIEW_EAS_BUILD == 'true') || (steps.mobile.outputs.build_profile == 'prod' && vars.ENABLE_PROD_EAS_BUILD == 'true')) }}
        env:
          EAS_BUILD_PROFILE: ${{ steps.mobile.outputs.build_profile }}
        working-directory: frontend
        run: eas build --platform android --profile "$EAS_BUILD_PROFILE" --non-interactive

      - name: Explain skipped mobile delivery
        if: ${{ steps.mobile.outputs.action == 'none' || (steps.mobile.outputs.action == 'update' && github.event_name != 'workflow_dispatch' && vars.ENABLE_PROD_EAS_UPDATE != 'true') || (steps.mobile.outputs.action == 'build' && steps.mobile.outputs.build_profile == 'prod-preview' && github.event_name != 'workflow_dispatch' && vars.ENABLE_PROD_PREVIEW_EAS_BUILD != 'true') || (steps.mobile.outputs.action == 'build' && steps.mobile.outputs.build_profile == 'prod' && github.event_name != 'workflow_dispatch' && vars.ENABLE_PROD_EAS_BUILD != 'true') }}
        run: |
          echo "Mobile delivery skipped."
          echo "Resolved action: ${{ steps.mobile.outputs.action }}"
          echo "Build profile: ${{ steps.mobile.outputs.build_profile }}"
          echo "Reason: ${{ steps.mobile.outputs.reason }}"
