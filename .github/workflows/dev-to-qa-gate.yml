name: Dev to QA Gate

on:
  pull_request:
    branches:
      - qa
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: dev-to-qa-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  validate-promotion-source:
    name: Validate promotion source
    runs-on: ubuntu-latest
    steps:
      - name: Require dev to qa promotion path
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Solo se permite promocionar cambios desde dev hacia qa."
            echo "Rama de origen actual: ${{ github.head_ref }}"
            exit 1
          fi

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: validate-promotion-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend/api-gateway
            service_name: api-gateway
          - service: backend/auth-service
            service_name: auth-service
          - service: backend/usuarios-service
            service_name: usuarios-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests
        run: mvn test

      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-to-qa-${{ matrix.service_name }}-test-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ matrix.service }}/target/surefire-reports/**
            ${{ matrix.service }}/target/site/jacoco/**

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: validate-promotion-source
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --silent

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-to-qa-frontend-coverage
          retention-days: 14
          if-no-files-found: warn
          path: frontend/coverage/**

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: validate-promotion-source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        run: mkdir -p qa-evidence

      - name: Run Semgrep free static analysis
        run: |
          docker run --rm -v "${PWD}:/src" -w /src semgrep/semgrep semgrep scan --config p/ci --sarif --output qa-evidence/semgrep.sarif

      - name: Upload static analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-to-qa-static-analysis-evidence
          retention-days: 14
          if-no-files-found: warn
          path: qa-evidence/**

  promotion-gate:
    name: Promotion gate
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
      - static-analysis
    if: always()
    steps:
      - name: Evaluate gate
        shell: bash
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ] ||
             [ "${{ needs.frontend-tests.result }}" != "success" ] ||
             [ "${{ needs.static-analysis.result }}" != "success" ]; then
            echo "Falló la compuerta de promoción dev hacia qa."
            echo "backend-tests=${{ needs.backend-tests.result }}"
            echo "frontend-tests=${{ needs.frontend-tests.result }}"
            echo "static-analysis=${{ needs.static-analysis.result }}"
            exit 1
          fi

          echo "Compuerta de promoción dev hacia qa aprobada."
